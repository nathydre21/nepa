name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # Secret scanning — gitleaks CLI (no license required)
  # ---------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks scan
        run: |
          gitleaks detect \
            --config .github/security/gitleaks.toml \
            --no-git \
            --verbose \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json || EXIT_CODE=$?
          if [ -f gitleaks-report.json ]; then
            CONTENT=$(cat gitleaks-report.json | tr -d '[:space:]')
            if [ "$CONTENT" != "[]" ] && [ "$CONTENT" != "null" ] && [ -n "$CONTENT" ]; then
              echo "::error::Secrets detected by gitleaks. See report for details."
              cat gitleaks-report.json
              exit 1
            fi
          fi
          echo "✅ No secrets detected"

  # ---------------------------------------------------------------
  # SAST — Semgrep CLI (report-only mode)
  # ---------------------------------------------------------------
  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: |
          python3 -m pip install --user semgrep==1.85.0
          semgrep --version
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --config p/react \
            --config p/nodejs \
            --config p/docker \
            --config p/sql-injection \
            --config p/xss \
            --sarif --output semgrep.sarif \
            || true
          echo "✅ Semgrep scan completed (report-only mode)"
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ---------------------------------------------------------------
  # SCA — Trivy filesystem scan (report-only mode)
  # ---------------------------------------------------------------
  sca:
    name: SCA (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan — report HIGH/CRITICAL (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  # ---------------------------------------------------------------
  # Dependency audit — npm audit for all workspaces
  # ---------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm install
      - name: Run npm audit (backend)
        run: cd backend && npm audit --audit-level=high || true
      - name: Run npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high || true
      - name: Run npm audit (contract dapp)
        run: cd contract && npm audit --audit-level=high || true

  # ---------------------------------------------------------------
  # SBOM — CycloneDX via Syft
  # ---------------------------------------------------------------
  sbom:
    name: SBOM (syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true
          upload-artifact-name: sbom.cyclonedx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  # ---------------------------------------------------------------
  # Security summary gate
  # ---------------------------------------------------------------
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, dependency-audit, sbom]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "SAST: ${{ needs.sast.result }}"
          echo "SCA: ${{ needs.sca.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "SBOM: ${{ needs.sbom.result }}"
          if [[ "${{ needs.secret-scan.result }}" != "success" || \
                "${{ needs.sca.result }}" != "success" || \
                "${{ needs.sbom.result }}" != "success" ]]; then
            echo "::error::One or more critical security jobs failed"
            exit 1
          fi
          echo "✅ All critical security jobs passed"
