name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Backend — lint, type-check, test
  # ---------------------------------------------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate || true

      - name: Lint backend
        run: |
          cd backend
          npm run lint:check

      - name: Type-check backend
        run: |
          cd backend
          npm run type-check

      - name: Run backend unit tests
        run: |
          cd backend
          npm run test:ci
        env:
          NODE_ENV: test

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ---------------------------------------------------------------
  # Frontend — lint, type-check, test, build
  # ---------------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Type-check & build frontend
        run: |
          cd frontend
          npm run build

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  # ---------------------------------------------------------------
  # Contract — Rust/Soroban build, test, clippy, format
  # ---------------------------------------------------------------
  contract-ci:
    name: Contract CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/nepa_contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/nepa_contract/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build contract
        run: |
          cd contract/nepa_contract
          cargo build --release --target wasm32-unknown-unknown
        continue-on-error: true

      - name: Run contract tests
        run: |
          cd contract/nepa_contract
          cargo test --verbose

      - name: Check formatting
        run: |
          cd contract/nepa_contract
          cargo fmt -- --check

      - name: Run clippy
        run: |
          cd contract/nepa_contract
          cargo clippy -- -D warnings
        continue-on-error: true

  # ---------------------------------------------------------------
  # Contract TypeScript dapp — test
  # ---------------------------------------------------------------
  contract-dapp-ci:
    name: Contract Dapp CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contract/package-lock.json

      - name: Install contract dapp dependencies
        run: |
          cd contract
          npm ci

      - name: Run contract dapp tests
        run: |
          cd contract
          npm test
        env:
          NODE_ENV: test

  # ---------------------------------------------------------------
  # Summary gate — all jobs must pass
  # ---------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, contract-ci, contract-dapp-ci]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Backend: ${{ needs.backend-ci.result }}"
          echo "Frontend: ${{ needs.frontend-ci.result }}"
          echo "Contract: ${{ needs.contract-ci.result }}"
          echo "Contract Dapp: ${{ needs.contract-dapp-ci.result }}"
          if [[ "${{ needs.backend-ci.result }}" != "success" || \
                "${{ needs.frontend-ci.result }}" != "success" || \
                "${{ needs.contract-ci.result }}" != "success" || \
                "${{ needs.contract-dapp-ci.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
