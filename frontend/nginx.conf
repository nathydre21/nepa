# NEPA frontend — nginx site config.
# Serves the Vite SPA and reverse-proxies the API/WebSocket to the backend so
# the whole app is same-origin behind one port.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip for text assets (hashed bundles are also long-cached below).
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # Baseline security headers.
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Container/load-balancer liveness probe — never touches the SPA or backend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # End-to-end readiness: proxies to the backend's /health so an external
    # probe (deploy/deploy.sh health gate, an LB) verifies the whole path
    # nginx → backend is up, not just that nginx is serving files.
    location = /health {
        proxy_pass         http://backend:3001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # REST API → backend.
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO / WebSocket upgrade → backend.
    location /socket.io/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Long-cache fingerprinted static assets.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico|wasm|map)$ {
        expires   1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history-API fallback — every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
